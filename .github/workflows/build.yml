name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: CMake build (Linux x86-64)
    runs-on: ubuntu-latest   # always x86-64 on GitHub-hosted runners

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libconfig++-dev \
            libboost-dev \
            libsparsehash-dev

      - name: Configure
        run: |
          cmake -S libfs -B libfs/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DRPC=fast \
            -DSCMPOOL=kernel \
            -DBUILD_BENCH=ON

      - name: Build
        run: cmake --build libfs/build --parallel $(nproc)

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: aerie-binaries
          path: |
            libfs/build/src/libfs.so
            libfs/build/src/pxfs_server
            libfs/build/src/pxfs_mkfs
            libfs/build/src/kvfs_server
            libfs/build/src/kvfs_mkfs
            libfs/build/src/cfs_server
            libfs/build/src/pool_tool
            libfs/build/bench/ubench/ubench_pxfs
          retention-days: 7
