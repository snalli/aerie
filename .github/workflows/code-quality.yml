name: Code Quality Checks

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'libfs/**/*.cc'
      - 'libfs/**/*.h'
      - '.clang-format'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'libfs/**/*.cc'
      - 'libfs/**/*.h'
      - '.clang-format'

jobs:
  formatting:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          clang-format --version

      - name: Check code formatting
        run: |
          cd libfs
          find . -name "*.cc" -o -name "*.h" | \
            grep -v ".build\|.generated\|postmark" | \
            while read file; do
              if ! clang-format --style=file "$file" | diff -q "$file" - > /dev/null 2>&1; then
                echo "Format check failed: $file"
                exit 1
              fi
            done
          echo "All files formatted correctly"

  static-analysis:
    name: Static Analysis (Critical Issues)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run static analysis
        run: bash scripts/analyze-code.sh critical

  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [formatting]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure build
        run: cd libfs && cmake . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cd libfs && make -j$(nproc)
