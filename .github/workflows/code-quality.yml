name: Code Quality Checks

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'libfs/**/*.cc'
      - 'libfs/**/*.h'
      - '.clang-format'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'libfs/**/*.cc'
      - 'libfs/**/*.h'
      - '.clang-format'

jobs:
  formatting:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format 22
        run: |
          sudo apt-get update
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y clang-format-22
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-22 100
          echo "clang-format version:"
          clang-format --version

      - name: Check code formatting
        run: bash scripts/format-code.sh --check

  static-analysis:
    name: Static Analysis (Critical Issues)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run static analysis
        run: bash scripts/analyze-code.sh critical

  build:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure build
        run: cd libfs && cmake . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cd libfs && make -j$(nproc)
