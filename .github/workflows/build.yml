name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  cmake:
    name: CMake build (Linux x86-64)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libconfig++-dev \
            libboost-dev \
            libsparsehash-dev

      - name: Configure
        run: |
          cmake -S libfs -B libfs/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DRPC=fast \
            -DSCMPOOL=kernel \
            -DBUILD_BENCH=ON

      - name: Build
        run: cmake --build libfs/build --parallel $(nproc)

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: aerie-binaries
          path: |
            libfs/build/src/pxfs/pxfs_server
            libfs/build/src/pxfs/pxfs_mkfs
            libfs/build/src/kvfs/kvfs_server
            libfs/build/src/kvfs/kvfs_mkfs
            libfs/build/src/cfs/cfs_server
            libfs/build/src/scm/pool_tool
            libfs/build/bench/ubench/ubench_pxfs
          retention-days: 7

  bench:
    name: ubench (all filesystems smoke test)
    runs-on: ubuntu-22.04
    needs: cmake

    env:
      LIBFS_CONFIG: ${{ github.workspace }}/libfs/libfs.ini

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libconfig++-dev libboost-dev libsparsehash-dev \
            iproute2

      - name: Build
        run: |
          cmake -S libfs -B libfs/build \
            -DCMAKE_BUILD_TYPE=Debug -DRPC=net -DSCMPOOL=user -DBUILD_BENCH=ON
          cmake --build libfs/build --parallel $(nproc)

      - name: Create storage pool
        run: libfs/build/src/scm/pool_tool create -p /tmp/stamnos_pool -s 128M

      - name: VFS baseline (no server)
        run: |
          mkdir -p /tmp/vfsbench
          echo "### VFS (Linux kernel baseline)" >> $GITHUB_STEP_SUMMARY
          result=$(libfs/build/bench/ubench/ubench_vfs \
            +fs_create -n 1 -p /tmp/vfsbench \
            +fs_open   -n 1 -p /tmp/vfsbench \
            +fs_read   -n 1 -p /tmp/vfsbench 2>&1)
          echo "$result"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$result" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: PXFS benchmark (pxfs_server)
        run: |
          libfs/build/src/pxfs/pxfs_mkfs create -p /tmp/stamnos_pool -s 128M -t mfs
          rm -f /tmp/shbuf_*
          libfs/build/src/pxfs/pxfs_server -p 10000 -d 0 -s /tmp/stamnos_pool &
          echo $! > /tmp/pxfs_server.pid
          for i in $(seq 1 30); do ss -ltn | grep -q ':10000' && break; sleep 1; done
          ss -ltn | grep -q ':10000' || { echo "pxfs_server failed"; exit 1; }
          sleep 3
          echo "### PXFS" >> $GITHUB_STEP_SUMMARY
          result=$(libfs/build/bench/ubench/ubench_pxfs -h 10000 \
            +fs_create   -n 1 -p /pxfs \
            +fs_open     -n 1 -p /pxfs \
            +fs_read     -n 1 -p /pxfs \
            +fs_seqwrite -n 1 -p /pxfs \
            +fs_seqread  -n 1 -p /pxfs 2>&1)
          echo "$result"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$result" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: RXFS benchmark (read-only client, same pxfs_server)
        run: |
          echo "### RXFS (read-only client)" >> $GITHUB_STEP_SUMMARY
          result=$(libfs/build/bench/ubench/ubench_rxfs -h 10000 \
            +fs_open -n 1 -p /rxfs \
            +fs_read -n 1 -p /rxfs 2>&1)
          echo "$result"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$result" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: OSD benchmark (raw object layer, same pxfs_server)
        run: |
          echo "### OSD (raw object storage layer)" >> $GITHUB_STEP_SUMMARY
          result=$(libfs/build/bench/ubench/ubench_osd -h 10000 \
            +create -n 1 \
            +open   -n 1 2>&1)
          echo "$result"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$result" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Stop pxfs server
        if: always()
        run: |
          [ -f /tmp/pxfs_server.pid ] && kill $(cat /tmp/pxfs_server.pid) || true
          rm -f /tmp/shbuf_*

      - name: CFS benchmark (cfs_server, separate pool)
        run: |
          rm -f /tmp/stamnos_pool
          libfs/build/src/scm/pool_tool create -p /tmp/stamnos_pool -s 128M
          libfs/build/src/cfs/cfs_mkfs  create -p /tmp/stamnos_pool -s 128M -t cfs
          libfs/build/src/cfs/cfs_server -p 10001 -d 0 -s /tmp/stamnos_pool &
          echo $! > /tmp/cfs_server.pid
          for i in $(seq 1 30); do ss -ltn | grep -q ':10001' && break; sleep 1; done
          ss -ltn | grep -q ':10001' || { echo "cfs_server failed"; exit 1; }
          sleep 3
          echo "### CFS (cache filesystem)" >> $GITHUB_STEP_SUMMARY
          result=$(libfs/build/bench/ubench/ubench_cfs -h 10001 \
            +fs_create -n 1 -p /pxfs \
            +fs_open   -n 1 -p /pxfs \
            +fs_read   -n 1 -p /pxfs 2>&1)
          echo "$result"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$result" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kill $(cat /tmp/cfs_server.pid) || true

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-22.04
    needs: cmake
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
