name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  cmake:
    name: CMake build (Linux x86-64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libconfig++-dev \
            libboost-dev \
            libsparsehash-dev

      - name: Configure
        run: |
          cmake -S libfs -B libfs/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DRPC=fast \
            -DSCMPOOL=kernel \
            -DBUILD_BENCH=ON

      - name: Build
        run: cmake --build libfs/build --parallel $(nproc)

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: aerie-binaries
          path: |
            libfs/build/src/pxfs/pxfs_server
            libfs/build/src/pxfs/pxfs_mkfs
            libfs/build/src/kvfs/kvfs_server
            libfs/build/src/kvfs/kvfs_mkfs
            libfs/build/src/cfs/cfs_server
            libfs/build/src/scm/pool_tool
            libfs/build/bench/ubench/ubench_pxfs
          retention-days: 7

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: cmake
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
